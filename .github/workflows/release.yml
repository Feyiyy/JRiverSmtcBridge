name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release (Single File Binary)
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item target/release/JRiver_SmtcBridge.exe publish/JRiver.SmtcBridge.exe

      - name: Upload Single-File Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: publish/JRiver.SmtcBridge.exe
          generate_release_notes: true
          draft: false
          prerelease: false
