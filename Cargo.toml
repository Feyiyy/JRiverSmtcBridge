[package]
name = "jriver-smtc-bridge"
version = "2.0.0"
edition = "2021"
authors = ["lmmlo"]
description = "Native Win32 & WinRT SMTC bridge for JRiver Media Center"

[[bin]]
name = "JRiver_SmtcBridge"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Foundation",
] }
ureq = { version = "3", default-features = false }
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
percent-encoding = "2.3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
